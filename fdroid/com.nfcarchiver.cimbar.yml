Categories:
  - File Encryption & Vault
  - File Transfer
License: MIT
AuthorName: mezinster
WebSite: https://nfcarchiver.com/cimbar/
SourceCode: https://github.com/mezinster/cimbar
IssueTracker: https://github.com/mezinster/cimbar/issues
Changelog: https://github.com/mezinster/cimbar/blob/HEAD/CHANGELOG.md

AutoName: CimBar Scanner

RepoType: git
Repo: https://github.com/mezinster/cimbar.git

Builds:
  - versionName: 0.12.1
    versionCode: 1891
    commit: v0.12.1
    subdir: app
    sudo:
      - echo "deb https://deb.debian.org/debian bookworm main" > /etc/apt/sources.list.d/bookworm.list
      - apt-get update
      - apt-get install -y -t bookworm openjdk-17-jdk-headless
      - update-java-alternatives -s java-1.17.0-openjdk-amd64
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - app/ios
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*FLUTTER_VERSION:\ '(.*)'/\1/p" ../.github/workflows/release.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter gen-l10n
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform
        android-arm


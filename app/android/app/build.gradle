plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.nfcarchiver.cimbar"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.nfcarchiver.cimbar"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }

    // AGP otherwise embeds a dependency-metadata block encrypted with a Google
    // key that only Play can read; F-Droid asks for APKs without it. The AAB is
    // only ever uploaded to Play, so it keeps the block.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = true
    }
}

// F-Droid publishes one APK per ABI instead of a single 59 MB fat APK, and it
// requires the ABI digit to sit in the LOWEST position of the version code
// (`10 * versionCode + abi`). Flutter's own Gradle plugin does the opposite for
// --split-per-abi builds -- `abi * 1000 + versionCode`, see ABI_VERSION in
// FlutterPlugin.kt -- which puts arm64 of 0.12.1 at 2189, ahead of armeabi-v7a
// of every later release (1190, 1191, ...), so arm64 users would never be
// offered an update. Re-override it here. Non-split builds have no ABI filter,
// so the universal APK and the AAB keep the plain pubspec versionCode.
// https://f-droid.org/docs/Submitting_to_F-Droid_Quick_Start_Guide/#setup-abi-split
def abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]
android.applicationVariants.configureEach { variant ->
    variant.outputs.each { output ->
        def abi = output.filters.find { it.filterType == "ABI" }?.identifier
        def abiVersionCode = abiCodes[abi]
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

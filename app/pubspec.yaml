name: cimbar_scanner
description: CimBar scanner — decode Color Icon Matrix Barcodes via camera or file import.
publish_to: 'none'
# The newest release in CHANGELOG.md (test/version_test.dart enforces it), and
# the single source of truth for the versionCode (the +N): release.yml builds
# with it and refuses a release whose name disagrees, and F-Droid's checkupdates
# bot parses this line at each release tag. Bump name AND code together with the
# CHANGELOG heading and a fastlane changelogs/<code>.txt in every locale.
version: 0.11.0+187

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  file_picker: ^13.1.0
  share_handler: ^0.0.21
  image: ^4.2.0
  pointycastle: ^3.9.1
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  url_launcher: ^6.2.5
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  mime: ^2.1.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  riverpod_annotation: ^2.3.5

flutter:
  # CocoaPods only on iOS: share_handler_ios (and its Share Extension pod)
  # has no Swift Package, and one dependency manager keeps the build
  # predictable. Remove once every iOS plugin ships a Package.swift.
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true

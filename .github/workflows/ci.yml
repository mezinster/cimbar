name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build debug APK'
        required: false
        type: boolean
        default: true

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # --enforce-lockfile is what F-Droid's build recipe runs: a pubspec.yaml
      # change without a matching pubspec.lock fails here instead of in an
      # F-Droid build pinned to an already-pushed release tag.
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: sh tests/run_all.sh

      - name: Upload decode reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decode-reports
          path: |
            app/build/corpus_report.txt
            app/build/benchmark.txt
          if-no-files-found: warn

  web-tests:
    name: Web App Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: sh tests/run_all.sh

  validate-metadata:
    name: Validate Store Metadata
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate F-Droid recipe and fastlane listings
        run: python3 tools/validate_store_metadata.py

  build-ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      # Builds Runner and the embedded ShareExtension; signing comes later
      # (App Store / TestFlight needs a team id, certificates and profiles).
      - name: Build iOS app without signing
        run: flutter build ios --release --no-codesign

      - name: Podfile.lock must match the committed one
        run: |
          if [ -f ios/Podfile.lock ] && git ls-files --error-unmatch ios/Podfile.lock >/dev/null 2>&1; then
            git diff --exit-code ios/Podfile.lock
          else
            echo "::warning::ios/Podfile.lock is not committed yet; download the ios-podfile-lock artifact and commit it"
          fi

      - name: Upload Podfile.lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-podfile-lock
          path: app/ios/Podfile.lock
          if-no-files-found: warn

  build-android:
    name: Build Debug APK
    needs: analyze-and-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
